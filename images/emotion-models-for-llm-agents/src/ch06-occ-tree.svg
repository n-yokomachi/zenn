<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
<rect width="1160" height="900" fill="#fbfbfa"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a8a80"/>
</marker>
</defs>

<!-- ルート -->
<rect x="430" y="40" width="300" height="52" rx="8" fill="#ffffff" stroke="#24241f" stroke-width="1.8"/>
<text x="580" y="66" font-size="18" fill="#24241f" text-anchor="middle">価値づけられた反応</text>
<text x="580" y="84" font-size="11" fill="#7a7a72" text-anchor="middle">VALENCED REACTION TO</text>

<line x1="500" y1="92" x2="250" y2="146" stroke="#8a8a80" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="580" y1="92" x2="580" y2="146" stroke="#8a8a80" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="660" y1="92" x2="950" y2="146" stroke="#8a8a80" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- 3分岐の見出し -->
<rect x="80" y="150" width="340" height="56" rx="8" fill="#ffffff" stroke="#8a8a80" stroke-width="1.5"/>
<text x="250" y="174" font-size="16" fill="#24241f" text-anchor="middle">出来事の結果（快く・不快に）</text>
<text x="250" y="194" font-size="11" fill="#7a7a72" text-anchor="middle">CONSEQUENCES OF EVENTS — pleased / displeased</text>

<rect x="460" y="150" width="340" height="56" rx="8" fill="#ffffff" stroke="#8a8a80" stroke-width="1.5"/>
<text x="630" y="174" font-size="16" fill="#24241f" text-anchor="middle">行為（是認して・否認して）</text>
<text x="630" y="194" font-size="11" fill="#7a7a72" text-anchor="middle">ACTIONS OF AGENTS — approving / disapproving</text>

<rect x="840" y="150" width="280" height="56" rx="8" fill="#ffffff" stroke="#8a8a80" stroke-width="1.5"/>
<text x="980" y="174" font-size="16" fill="#24241f" text-anchor="middle">対象の性質（好んで・嫌って）</text>
<text x="980" y="194" font-size="11" fill="#7a7a72" text-anchor="middle">ASPECTS OF OBJECTS — liking / disliking</text>

<!-- 出来事: 他者にとって -->
<path d="M80,178 L56,178 L56,724" fill="none" stroke="#8a8a80" stroke-width="1.2"/>
<line x1="56" y1="336" x2="77" y2="336" stroke="#8a8a80" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="56" y1="546" x2="77" y2="546" stroke="#8a8a80" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="56" y1="724" x2="77" y2="724" stroke="#8a8a80" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="98" y="238" font-size="12" fill="#7a7a72">他者にとっての結果</text>
<rect x="80" y="252" width="340" height="168" rx="8" fill="none" stroke="#b0562c" stroke-width="1.4"/>
<text x="98" y="278" font-size="14" fill="#b0562c">他者の運命　fortunes-of-others</text>
<text x="98" y="304" font-size="12" fill="#7a7a72">相手に望ましい結果 × 相手への好意で分かれる</text>
<text x="110" y="334" font-size="16" fill="#24241f">共感的喜び <tspan font-size="11" fill="#7a7a72">happy-for</tspan></text>
<text x="270" y="334" font-size="16" fill="#24241f">妬み <tspan font-size="11" fill="#7a7a72">resentment</tspan></text>
<text x="110" y="368" font-size="16" fill="#24241f">哀れみ <tspan font-size="11" fill="#7a7a72">pity</tspan></text>
<text x="270" y="368" font-size="16" fill="#24241f">シャーデンフロイデ</text>
<text x="270" y="386" font-size="11" fill="#7a7a72">gloating</text>
<text x="110" y="404" font-size="12" fill="#7a7a72">上段: 望ましい結果　下段: 望ましくない結果</text>

<!-- 出来事: 自分にとって(見込みあり) -->
<text x="98" y="438" font-size="12" fill="#7a7a72">自分にとっての結果（見込みとその当たり外れ）</text>
<rect x="80" y="448" width="340" height="196" rx="8" fill="none" stroke="#2f6fb3" stroke-width="1.4"/>
<text x="98" y="474" font-size="14" fill="#2f6fb3">見込み　prospect-based</text>
<text x="110" y="504" font-size="16" fill="#24241f">希望 <tspan font-size="11" fill="#7a7a72">hope</tspan></text>
<text x="270" y="504" font-size="16" fill="#24241f">恐れ <tspan font-size="11" fill="#7a7a72">fear</tspan></text>
<text x="110" y="536" font-size="12" fill="#7a7a72">↓ 見込みが当たった</text>
<text x="110" y="566" font-size="16" fill="#24241f">充足 <tspan font-size="11" fill="#7a7a72">satisfaction</tspan></text>
<text x="270" y="566" font-size="16" fill="#24241f">恐れの的中 <tspan font-size="11" fill="#7a7a72">fears-confirmed</tspan></text>
<text x="110" y="596" font-size="12" fill="#7a7a72">↓ 見込みが外れた</text>
<text x="110" y="626" font-size="16" fill="#24241f">失望 <tspan font-size="11" fill="#7a7a72">disappointment</tspan></text>
<text x="270" y="626" font-size="16" fill="#24241f">安堵 <tspan font-size="11" fill="#7a7a72">relief</tspan></text>

<!-- 出来事: 自分にとって(確定) -->
<text x="98" y="662" font-size="12" fill="#7a7a72">自分にとっての結果（確定）</text>
<rect x="80" y="672" width="340" height="104" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.4"/>
<text x="98" y="698" font-size="14" fill="#7a7a72">幸福　well-being</text>
<text x="110" y="732" font-size="16" fill="#24241f">喜び <tspan font-size="11" fill="#7a7a72">joy</tspan></text>
<text x="270" y="732" font-size="16" fill="#24241f">苦悩 <tspan font-size="11" fill="#7a7a72">distress</tspan></text>
<text x="110" y="762" font-size="12" fill="#7a7a72">望ましい結果 / 望ましくない結果</text>

<!-- 行為 -->
<line x1="630" y1="206" x2="630" y2="248" stroke="#8a8a80" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="460" y="252" width="340" height="168" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.4"/>
<text x="478" y="278" font-size="14" fill="#7a7a72">行為の評価　attribution</text>
<text x="478" y="304" font-size="12" fill="#7a7a72">誰の行為かで分かれる</text>
<text x="490" y="338" font-size="16" fill="#24241f">誇り <tspan font-size="11" fill="#7a7a72">pride</tspan></text>
<text x="650" y="338" font-size="16" fill="#24241f">恥 <tspan font-size="11" fill="#7a7a72">shame</tspan></text>
<text x="490" y="372" font-size="16" fill="#24241f">敬服 <tspan font-size="11" fill="#7a7a72">admiration</tspan></text>
<text x="650" y="372" font-size="16" fill="#24241f">非難 <tspan font-size="11" fill="#7a7a72">reproach</tspan></text>
<text x="490" y="404" font-size="12" fill="#7a7a72">上段: 自分の行為　下段: 他者の行為</text>

<!-- 対象 -->
<line x1="980" y1="206" x2="980" y2="248" stroke="#8a8a80" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="840" y="252" width="280" height="122" rx="8" fill="none" stroke="#8a8a80" stroke-width="1.4"/>
<text x="858" y="278" font-size="14" fill="#7a7a72">好悪　attraction</text>
<text x="870" y="314" font-size="16" fill="#24241f">好意 <tspan font-size="11" fill="#7a7a72">love</tspan></text>
<text x="1000" y="314" font-size="16" fill="#24241f">反感 <tspan font-size="11" fill="#7a7a72">hate</tspan></text>
<text x="858" y="352" font-size="12" fill="#7a7a72">魅力のある対象 / 魅力のない対象</text>

<!-- 複合 -->
<path d="M420,724 L520,724 L560,796" fill="none" stroke="#dcdcd6" stroke-width="1.6"/>
<path d="M630,420 L630,600 L600,790" fill="none" stroke="#dcdcd6" stroke-width="1.6"/>
<rect x="460" y="800" width="460" height="76" rx="8" fill="none" stroke="#24241f" stroke-width="1.6"/>
<text x="478" y="826" font-size="14" fill="#24241f">複合　well-being / attribution compounds　<tspan font-size="12" fill="#7a7a72">結果と行為に同時に焦点</tspan></text>
<text x="490" y="858" font-size="16" fill="#24241f">達成感 <tspan font-size="11" fill="#7a7a72">gratification</tspan>　感謝 <tspan font-size="11" fill="#7a7a72">gratitude</tspan>　悔恨 <tspan font-size="11" fill="#7a7a72">remorse</tspan>　怒り <tspan font-size="11" fill="#7a7a72">anger</tspan></text>

<!-- 注記 -->
<text x="840" y="440" font-size="13" fill="#7a7a72">Ortony, Clore &amp; Collins (1988)の</text>
<text x="840" y="460" font-size="13" fill="#7a7a72">Figure 2.1をもとに再構成した図です。</text>
<text x="840" y="480" font-size="13" fill="#7a7a72">枠と条件が構造、感情名は各タイプの</text>
<text x="840" y="500" font-size="13" fill="#7a7a72">代表語です。感情名の日本語訳は</text>
<text x="840" y="520" font-size="13" fill="#7a7a72">本書によるものです。</text>
<text x="840" y="540" font-size="13" fill="#7a7a72">薄い線は複合への合流を示します。</text>
</svg>
