<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <rect width="1160" height="620" fill="#fbfbfa"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a80"/>
    </marker>
  </defs>

  <!-- 見出し -->
  <text x="60" y="66" font-size="20" fill="#6b6b66">契機1　会話のターン</text>
  <line x1="60" y1="82" x2="560" y2="82" stroke="#dcdcd6" stroke-width="1"/>
  <text x="60" y="112" font-size="16" fill="#7a7a72">推論のたびに起きる変化</text>
  <text x="620" y="66" font-size="20" fill="#6b6b66">契機2　時間の経過</text>
  <line x1="620" y1="82" x2="1100" y2="82" stroke="#dcdcd6" stroke-width="1"/>
  <text x="620" y="112" font-size="16" fill="#7a7a72">呼び出しと呼び出しの間にも進む変化</text>

  <!-- 左の流れ -->
  <rect x="110" y="150" width="280" height="70" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="250" y="193" font-size="19" fill="#24241f" text-anchor="middle">相手の発話（出来事）</text>
  <line x1="250" y1="220" x2="250" y2="286" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="110" y="290" width="280" height="70" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="250" y="333" font-size="19" fill="#24241f" text-anchor="middle">変化量の評価</text>

  <!-- 右の流れ -->
  <rect x="770" y="150" width="280" height="70" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="910" y="193" font-size="19" fill="#24241f" text-anchor="middle">時間の経過</text>
  <line x1="910" y1="220" x2="910" y2="286" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="770" y="290" width="280" height="70" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="910" y="333" font-size="19" fill="#24241f" text-anchor="middle">基準への復帰（減衰）</text>

  <!-- 外部状態へ -->
  <path d="M250,360 L250,505 L452,505" fill="none" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="496" font-size="16" fill="#8a6a3a" text-anchor="middle">更新の規則</text>
  <path d="M910,360 L910,505 L708,505" fill="none" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="830" y="496" font-size="16" fill="#8a6a3a" text-anchor="middle">基準と戻り方</text>

  <rect x="460" y="460" width="240" height="90" rx="6" fill="#ffffff" stroke="#5a5a52" stroke-width="2.5"/>
  <text x="580" y="514" font-size="21" fill="#24241f" text-anchor="middle">外部状態</text>

  <!-- 応答して次のターンへ -->
  <path d="M460,532 L85,532 L85,185 L104,185" fill="none" stroke="#8a8a80" stroke-width="1.5" stroke-dasharray="6,6" marker-end="url(#a)"/>
  <text x="110" y="562" font-size="16" fill="#7a7a72">状態を読んで応答し、次のターンへ</text>

  <text x="620" y="604" font-size="18" fill="#7a7a72">どちらの契機も、同じ外部状態を更新する。</text>
</svg>
