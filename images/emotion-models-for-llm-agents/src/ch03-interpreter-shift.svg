<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <rect width="1160" height="650" fill="#fbfbfa"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a80"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6a3a"/>
    </marker>
  </defs>

  <!-- 見出し -->
  <text x="80" y="66" font-size="20" fill="#6b6b66">LLM 以前（2005年ごろ）</text>
  <line x1="80" y1="82" x2="520" y2="82" stroke="#dcdcd6" stroke-width="1"/>
  <text x="640" y="66" font-size="20" fill="#6b6b66">LLM 以後</text>
  <line x1="640" y1="82" x2="1080" y2="82" stroke="#dcdcd6" stroke-width="1"/>

  <!-- 数値の核 -->
  <rect x="80" y="100" width="440" height="90" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="300" y="138" font-size="20" fill="#24241f" text-anchor="middle">感情の数値の核</text>
  <text x="300" y="168" font-size="16" fill="#7a7a72" text-anchor="middle">保持・減衰は決定論の処理</text>
  <rect x="640" y="100" width="440" height="90" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="860" y="138" font-size="20" fill="#24241f" text-anchor="middle">感情の数値の核</text>
  <text x="860" y="168" font-size="16" fill="#7a7a72" text-anchor="middle">保持・減衰は決定論の処理</text>

  <line x1="300" y1="190" x2="300" y2="236" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="190" x2="860" y2="236" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 解釈と言語化の層 -->
  <rect x="80" y="240" width="440" height="110" rx="6" fill="#f7f1e8" stroke="#8a6a3a" stroke-width="2"/>
  <text x="300" y="270" font-size="15" fill="#8a6a3a" text-anchor="middle">解釈と言語化の層</text>
  <text x="300" y="308" font-size="19" fill="#24241f" text-anchor="middle">テンプレート・規則・アニメーション</text>
  <rect x="640" y="240" width="440" height="110" rx="6" fill="#f7f1e8" stroke="#8a6a3a" stroke-width="2"/>
  <text x="860" y="270" font-size="15" fill="#8a6a3a" text-anchor="middle">解釈と言語化の層</text>
  <text x="860" y="314" font-size="26" fill="#24241f" text-anchor="middle">LLM</text>

  <!-- 交代 -->
  <rect x="524" y="256" width="112" height="24" fill="#fbfbfa"/>
  <text x="578" y="274" font-size="16" fill="#8a6a3a" text-anchor="middle">担い手の交代</text>
  <line x1="524" y1="295" x2="632" y2="295" stroke="#8a6a3a" stroke-width="2" marker-end="url(#b)"/>

  <line x1="300" y1="350" x2="300" y2="396" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="350" x2="860" y2="396" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 表出 -->
  <rect x="80" y="400" width="440" height="100" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="300" y="428" font-size="15" fill="#7a7a72" text-anchor="middle">表出</text>
  <text x="300" y="464" font-size="18" fill="#24241f" text-anchor="middle">用意された発話や表情から選ぶ</text>
  <rect x="640" y="400" width="440" height="100" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="860" y="428" font-size="15" fill="#7a7a72" text-anchor="middle">表出</text>
  <text x="860" y="464" font-size="18" fill="#24241f" text-anchor="middle">文脈に応じて言葉を組み立てる</text>

  <text x="80" y="610" font-size="18" fill="#7a7a72">分業の形は同じまま、解釈と言語化の担い手が置き換わりました。</text>
</svg>
