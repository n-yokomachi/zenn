<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <rect width="1160" height="620" fill="#fbfbfa"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8a80"/>
    </marker>
  </defs>

  <!-- 見出し -->
  <text x="60" y="66" font-size="20" fill="#6b6b66">LLM の外側</text>
  <line x1="60" y1="82" x2="620" y2="82" stroke="#dcdcd6" stroke-width="1"/>
  <text x="720" y="66" font-size="20" fill="#6b6b66">LLM の内側</text>
  <line x1="720" y1="82" x2="1100" y2="82" stroke="#dcdcd6" stroke-width="1"/>

  <!-- 境界 -->
  <text x="670" y="66" font-size="17" fill="#8a6a3a" text-anchor="middle">境界</text>
  <line x1="670" y1="80" x2="670" y2="560" stroke="#8a6a3a" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- 外部状態 -->
  <rect x="60" y="106" width="520" height="300" rx="6" fill="#ffffff" stroke="#5a5a52" stroke-width="1.5"/>
  <text x="90" y="146" font-size="22" fill="#24241f">外部状態</text>
  <line x1="90" y1="164" x2="550" y2="164" stroke="#ececea" stroke-width="1"/>
  <text x="90" y="202" font-size="19" fill="#24241f">状態</text>
  <text x="270" y="201" font-size="17" fill="#7a7a72">いま、何が、どれだけあるか</text>
  <text x="90" y="254" font-size="19" fill="#24241f">時間</text>
  <text x="270" y="253" font-size="17" fill="#7a7a72">それはいつの状態か</text>
  <text x="90" y="306" font-size="19" fill="#24241f">更新の規則</text>
  <text x="270" y="305" font-size="17" fill="#7a7a72">出来事が起きたらどう変わるか</text>
  <text x="90" y="358" font-size="19" fill="#24241f">基準と戻り方</text>
  <text x="270" y="357" font-size="17" fill="#7a7a72">何もしなければどこへ向かうか</text>

  <!-- 決定論の処理 -->
  <rect x="60" y="470" width="520" height="90" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="320" y="507" font-size="20" fill="#24241f" text-anchor="middle">決定論の処理</text>
  <text x="320" y="539" font-size="17" fill="#7a7a72" text-anchor="middle">保持・減衰・演算を規則どおりに実行</text>
  <line x1="320" y1="470" x2="320" y2="414" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="336" y="447" font-size="16" fill="#8a6a3a">更新</text>

  <!-- 受け渡し -->
  <rect x="582" y="182" width="140" height="26" fill="#fbfbfa"/>
  <line x1="580" y1="220" x2="714" y2="220" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="650" y="202" font-size="16" fill="#8a6a3a" text-anchor="middle">数値のまま渡す</text>

  <!-- 解釈・言語化 -->
  <rect x="720" y="150" width="380" height="140" rx="6" fill="#ffffff" stroke="#5a5a52" stroke-width="1.5"/>
  <text x="910" y="205" font-size="21" fill="#24241f" text-anchor="middle">解釈・言語化</text>
  <text x="910" y="240" font-size="17" fill="#7a7a72" text-anchor="middle">数値に文脈の中で意味を与える</text>
  <line x1="910" y1="290" x2="910" y2="396" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 応答 -->
  <rect x="720" y="400" width="380" height="90" rx="6" fill="#ffffff" stroke="#b9b9b1" stroke-width="1.5"/>
  <text x="910" y="437" font-size="20" fill="#24241f" text-anchor="middle">応答</text>
  <text x="910" y="469" font-size="17" fill="#7a7a72" text-anchor="middle">文脈に応じた言葉</text>

  <text x="60" y="606" font-size="18" fill="#7a7a72">保持・減衰・演算は決定論の側に、解釈と言語化は LLM の側に置きます。</text>
</svg>
