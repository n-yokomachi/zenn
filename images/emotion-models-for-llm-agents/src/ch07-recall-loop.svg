<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
<rect width="1160" height="700" fill="#fbfbfa"/>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a8a80"/>
</marker>
</defs>

<text x="80" y="56" font-size="20" fill="#24241f">会話のターン（構成のループ）</text>
<line x1="80" y1="70" x2="560" y2="70" stroke="#dcdcd6" stroke-width="1.5"/>

<!-- 中央の流れ -->
<rect x="150" y="100" width="380" height="76" rx="8" fill="#ffffff" stroke="#8a8a80" stroke-width="1.5"/>
<text x="340" y="131" font-size="18" fill="#24241f" text-anchor="middle">想起（recall）</text>
<text x="340" y="158" font-size="13" fill="#7a7a72" text-anchor="middle">似た経験の上位K件と、2軸の値・語彙マップ</text>

<line x1="340" y1="176" x2="340" y2="218" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#arw)"/>

<rect x="150" y="222" width="380" height="76" rx="8" fill="#ffffff" stroke="#2f6fb3" stroke-width="2"/>
<text x="340" y="253" font-size="18" fill="#24241f" text-anchor="middle">LLMが構成して応答</text>
<text x="340" y="280" font-size="13" fill="#7a7a72" text-anchor="middle">過去の自分の名前と2軸と語彙から、いまを名づける</text>

<line x1="340" y1="298" x2="340" y2="340" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#arw)"/>

<rect x="150" y="344" width="380" height="58" rx="8" fill="#ffffff" stroke="#8a8a80" stroke-width="1.5"/>
<text x="340" y="379" font-size="17" fill="#24241f" text-anchor="middle">feelが2軸の差分を適用</text>

<line x1="340" y1="402" x2="340" y2="444" stroke="#8a8a80" stroke-width="1.5" marker-end="url(#arw)"/>

<rect x="150" y="448" width="380" height="76" rx="8" fill="#ffffff" stroke="#24241f" stroke-width="2"/>
<text x="340" y="479" font-size="18" fill="#24241f" text-anchor="middle">remember</text>
<text x="340" y="506" font-size="13" fill="#7a7a72" text-anchor="middle">構成した名前（label）と14属性を保存</text>

<!-- 自己参照の戻り -->
<path d="M150,486 L86,486 L86,138 L146,138" fill="none" stroke="#b0562c" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arw)"/>
<text x="60" y="560" font-size="15" fill="#b0562c">申告した14属性が、次のターンの想起のクエリになります（1ターンのラグ）。</text>

<!-- 概念ストア -->
<rect x="700" y="180" width="380" height="270" rx="10" fill="none" stroke="#8a8a80" stroke-width="1.8"/>
<text x="890" y="216" font-size="18" fill="#24241f" text-anchor="middle">概念ストア</text>
<text x="890" y="244" font-size="13" fill="#7a7a72" text-anchor="middle">経験の一覧（id・label・14属性・当時の2軸・重要度）</text>
<text x="720" y="286" font-size="14" fill="#7a7a72">・想起された経験は「最終想起時刻」が更新される</text>
<text x="734" y="308" font-size="14" fill="#7a7a72">（思い出すほど、思い出されやすくなる）</text>
<text x="720" y="340" font-size="14" fill="#7a7a72">・上限を超えると、古く些末な経験から忘れられる</text>
<text x="720" y="372" font-size="14" fill="#7a7a72">・経験の値は減衰しない。薄れるのは</text>
<text x="734" y="394" font-size="14" fill="#7a7a72">思い出されやすさだけ</text>
<text x="720" y="426" font-size="14" fill="#7a7a72">・ストアはセッションを跨いで生存する</text>

<line x1="700" y1="240" x2="534" y2="146" stroke="#8a8a80" stroke-width="1.3" marker-end="url(#arw)"/>
<text x="596" y="176" font-size="13" fill="#8a6a3a">上位K件を返す</text>
<line x1="530" y1="486" x2="700" y2="420" stroke="#8a8a80" stroke-width="1.3" marker-end="url(#arw)"/>
<text x="586" y="470" font-size="13" fill="#8a6a3a">経験を追記</text>

<!-- 注記 -->
<text x="80" y="640" font-size="15" fill="#7a7a72">新しいストアでは想起は空で、材料は2軸と語彙だけから始まります。時間の経過のループ（tick）はプルチックの感情の輪と同じです。</text>
</svg>
